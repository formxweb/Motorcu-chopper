name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash {0}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mc
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: mc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mc:mc@localhost:5432/mc
      APP_URL: http://localhost:3000
      IYZICO_BASE_URL: http://localhost:4010
      IYZICO_API_KEY: sandbox-test-anahtar
      IYZICO_SECRET_KEY: sandbox-test-gizli
      ADMIN_EMAIL: yonetici@example.com
      ADMIN_PASSWORD: Yonetici-Sifre-123
      CRON_SECRET: test-cron-sirri
      STORAGE_LOCAL: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Paketleri kur
        run: |
          mkdir -p out
          if [ -f package-lock.json ]; then npm ci > out/kurulum.txt 2>&1; else npm install > out/kurulum.txt 2>&1; fi
          echo "kurulum=$?" >> out/durum.txt
          cp package-lock.json out/ 2>/dev/null
          npx playwright install --with-deps chromium > out/playwright-kurulum.txt 2>&1

      - name: Veritabanı göçleri
        run: |
          npx drizzle-kit generate --name sema > out/drizzle.txt 2>&1
          echo "drizzle=$?" >> out/durum.txt
          git status --porcelain drizzle >> out/drizzle.txt
          mkdir -p out/drizzle && cp -r drizzle/. out/drizzle/

      - name: Tip kontrolü
        run: |
          npx next typegen > out/typegen.txt 2>&1
          npx tsc --noEmit > out/tsc.txt 2>&1
          echo "tsc=$?" >> out/durum.txt

      - name: Örnek görseller
        if: hashFiles('public/ornek/hero.webp') == ''
        run: |
          node tools/ornek-gorseller/render.mjs > out/gorseller.txt 2>&1
          echo "gorseller=$?" >> out/durum.txt
          mkdir -p out/ornek && cp -r public/ornek/. out/ornek/

      - name: Veritabanı kurulumu
        run: |
          npx tsx scripts/setup.ts > out/setup.txt 2>&1
          echo "setup=$?" >> out/durum.txt

      - name: Derleme
        run: |
          npx next build > out/build.txt 2>&1
          echo "build=$?" >> out/durum.txt

      - name: Uçtan uca test
        run: |
          if ! grep -q "^build=0" out/durum.txt; then echo "e2e=atlandı" >> out/durum.txt; exit 0; fi
          node tests/e2e/mock-iyzico.mjs > out/mock.txt 2>&1 &
          npx next start -p 3000 > out/server.txt 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npx playwright test > out/e2e.txt 2>&1
          echo "e2e=$?" >> out/durum.txt

      - name: Sonuçları ci-results dalına yaz
        if: always()
        run: |
          cd out
          git init -q -b ci-results
          git config user.name ci
          git config user.email ci@example.com
          git add -A
          git commit -qm "ci ${GITHUB_RUN_ID} ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

      - name: Sonuç
        run: |
          cat out/durum.txt
          if grep -Eq "=([1-9]|atlandı)" out/durum.txt; then exit 1; fi
