name: probe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p out
          {
          for p in next react react-dom drizzle-orm drizzle-kit postgres zod bcryptjs nodemailer tsx typescript @types/node @types/react @types/react-dom @types/bcryptjs @types/nodemailer @playwright/test @fontsource/pirata-one @fontsource/big-shoulders-display @fontsource/archivo sharp; do echo "$p $(npm view $p version)"; done
          npm view next@latest engines peerDependencies
          npm view next dist-tags
          curl -s -o /dev/null -w "iyzico sandbox %{http_code}\n" https://sandbox-api.iyzipay.com/payment/test
          curl -s https://sandbox-api.iyzipay.com/payment/test; echo
          } > out/probe.txt 2>&1
          echo "::notice title=probe::$(head -c 3000 out/probe.txt | tr '\n' '|')"
      - name: sonuçları gönder
        if: always()
        run: |
          cd out
          git init -q -b ci-results
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "ci $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
