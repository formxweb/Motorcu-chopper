name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for p in next react react-dom drizzle-orm drizzle-kit postgres zod bcryptjs nodemailer tsx typescript @types/node @types/react @types/react-dom @types/bcryptjs @types/nodemailer @playwright/test @fontsource/pirata-one @fontsource/big-shoulders-display @fontsource/archivo sharp eslint; do echo "$p $(npm view $p version)"; done
          npm view next@latest engines
          npm view next dist-tags
          curl -s -o /dev/null -w "iyzico sandbox %{http_code}\n" https://sandbox-api.iyzipay.com/payment/test
          curl -s https://sandbox-api.iyzipay.com/payment/test
